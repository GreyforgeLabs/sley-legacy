name: Sley v1 Gate

on:
  pull_request:
  push:
    branches:
      - public

permissions:
  contents: read

jobs:
  v1:
    name: make v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          npm install --global --ignore-scripts typescript@5.9.3

      - name: Run Sley v1 gate
        uses: ./.github/actions/sley-v1

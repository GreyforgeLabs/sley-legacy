name: Sley v1 Gate

on:
  pull_request:
  push:
    branches:
      - public

permissions:
  contents: read

jobs:
  v1:
    name: make v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Sley v1 gate
        uses: ./.github/actions/sley-v1

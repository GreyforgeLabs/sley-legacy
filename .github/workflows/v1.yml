name: Sley v1 Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  v1:
    name: make v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run v1 gate
        run: make v1

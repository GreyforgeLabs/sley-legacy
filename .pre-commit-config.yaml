repos:
  - repo: local
    hooks:
      - id: git-sley-guard
        name: Sley staged source and contract guard
        entry: bin/git-sley-guard
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: sley-v1
        name: Sley v1 pre-push gate
        entry: make v1
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

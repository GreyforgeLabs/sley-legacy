[package]
name = "sley"
version = "0.1.0"
edition = "2024"
default-run = "sley"

[[bin]]
name = "sley"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.46.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
toml = "1.1.2"
